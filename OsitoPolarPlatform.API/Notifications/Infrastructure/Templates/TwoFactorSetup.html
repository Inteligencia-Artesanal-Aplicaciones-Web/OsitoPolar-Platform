<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication Setup</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: #ffffff;
            padding: 30px;
            text-align: center;
        }
        .content {
            padding: 40px 30px;
        }
        .button {
            display: inline-block;
            background-color: #9b59b6;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 5px;
            font-weight: 600;
            margin: 20px 0;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 25px 30px;
            text-align: center;
            font-size: 13px;
            color: #6c757d;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Two-Factor Authentication Setup</h1>
        </div>
        <div class="content">
            <h2>Secure Your Account</h2>
            <p>Please complete your Two-Factor Authentication setup to secure your account.</p>
            <center>
                <a href="{{setupUrl}}" class="button">Complete 2FA Setup</a>
            </center>
        </div>
        <div class="footer">
            <p>Need help? Contact us at <a href="mailto:support@ositopolar.com">support@ositopolar.com</a></p>
            <p>© 2025 OsitoPolar Platform. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
